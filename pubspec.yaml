name: agrinexa
description: Agrinexa - Data hari ini, panen esok. Asisten pilihan komoditas & simulasi usaha tani untuk petani.
publish_to: "none"
version: 1.1.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  http: ^1.2.2
  flutter_tts: ^4.2.5
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  supabase_flutter: ^2.18.3
  cloud_firestore: ^7.1.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
